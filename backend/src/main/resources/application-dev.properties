# ==============================================================================
# Local development only. Activate with: SPRING_PROFILES_ACTIVE=dev
#
# This file is the explicit opt in for the development conveniences that must never
# apply to a deployed environment: the loopback CORS origins and the fallback token
# secret. Nothing here is loaded unless the `dev` (or `local`) profile is active, and
# `DeploymentConfigurationValidator` treats any other profile set as a real deployment.
# ==============================================================================

# Loopback origins are restored for the Vite dev server and a locally served build.
# Exact ports are listed rather than http://localhost:* so that a stray process on an
# unrelated local port is not implicitly trusted with credentials.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://skill-checkr.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Development fallback secret. It is committed to this repository on purpose, so it only
# makes tokens predictable locally; any profile other than dev/local/test is rejected at
# startup while this value is in use. Set TOKEN_SECRET to get restart-stable local tokens.
app.security.token-secret=${TOKEN_SECRET:skillcheckr-local-development-secret-key-change-me}

# Local development publishes component detail for the health endpoint; the base properties
# and the prod profile keep it at `never`.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
