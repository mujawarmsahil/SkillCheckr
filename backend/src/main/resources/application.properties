# ==============================================================================
# SkillCheckr Spring Boot Application Configuration
# All properties are fully overridable via standard System Environment Variables
# ==============================================================================

# Application Metadata
spring.application.name=${APP_NAME:SkillCheckr-Backend}

# Local development: load the git-ignored backend/.env when the backend is started
# from the backend directory. The import is optional, so CI and production start
# unaffected, and real environment variables still take precedence over the file.
spring.config.import=optional:file:.env[.properties]

# Server HTTP Port & Host Binding (Render uses PORT and binds to 0.0.0.0)
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Connection Settings
# serverTimezone only tells the driver how to interpret absolute-point columns (TIMESTAMP,
# DATE). Every scheduling column this application writes -- exam.exam_date and the
# exam_attempt.started_at / expires_at / submitted_at and result.submitted_at DATETIME
# values -- is a timezone-free wall-clock value that is bound as java.time.LocalDateTime, so
# no driver conversion applies to it and the URL timezone cannot shift those rows onto a
# different calendar day.
# Remaining requirement, unrelated to JDBC: the JVM zone and the MySQL server zone should
# be the same. Exam windows are evaluated in Java with LocalDateTime.now() (JVM zone) and in
# SQL with CURDATE()/CURTIME() (server zone); if the two differ, those two views of "now"
# disagree by the offset between them.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_application_system}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Teacher-uploaded student question-bank PDFs are limited to 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Flyway owns the application schema lifecycle. Version 1 is the current
# schema: empty databases run V1, while existing non-empty databases baseline
# at V1 and then receive later migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never

# JPA / Hibernate. Flyway owns the schema; Hibernate only validates the entity
# mappings against it, so a mapping/schema mismatch is a hard startup failure
# rather than silent drift.
spring.jpa.hibernate.ddl-auto=validate
# Open Session in View is off: nothing needs the session after a @Transactional
# method returns, and leaving it on would hide missing transaction boundaries
# behind lazy loads during response serialization.
spring.jpa.open-in-view=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:30000}

# Cross-Origin Resource Sharing (CORS)
# These defaults describe the real deployment: the hosted frontend only. Loopback origins are
# intentionally NOT part of this default, because a wildcard loopback origin combined with
# credentials would let any local process read authenticated responses. Start the backend with
# the `dev` profile (SPRING_PROFILES_ACTIVE=dev) to get the localhost origins back.
# Override with CORS_ALLOWED_ORIGINS (comma separated) in any deployed environment.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://skill-checkr.vercel.app}
# The API is stateless and authenticates with an Authorization bearer header, never a cookie.
# The flag stays configurable because changing it also changes the browser contract.
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# JSON number binding: a fractional JSON number must be refused rather than coerced into an
# int or long field. Jackson enables ACCEPT_FLOAT_AS_INT by default, which silently truncates
# a value such as 100.5 to 100. Every marks value in this application is a whole number
# (`question.marks`, `exam.total_marks`, `exam.pass_marks`, `attempt_answer.marks_obtained`
# and `result.marks_obtained` are all INT columns), so truncating here would store a mark the
# teacher never awarded. Turning the feature off makes such a request a 400 instead.
spring.jackson.deserialization.accept-float-as-int=false

# Authentication: HMAC-SHA256 signed bearer tokens (no third-party dependency)
# There is deliberately NO fallback value here. A committed default secret would let any
# environment that forgets to set TOKEN_SECRET start successfully while signing forgeable
# tokens. Leave it empty and `TokenService` generates an ephemeral random secret for the run
# (safe, but every token dies on restart); `DeploymentConfigurationValidator` then refuses to
# start unless every active profile is a development profile (`dev`, `local` or `test`).
# Real deployments must supply a private secret of at least 32 characters, for example:
# openssl rand -base64 48
app.security.token-secret=${TOKEN_SECRET:}
app.security.token-ttl-minutes=${TOKEN_TTL_MINUTES:120}
app.security.rate-limit.login.requests=${AUTH_LOGIN_RATE_LIMIT_REQUESTS:10}
app.security.rate-limit.login.window-seconds=${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.registration.requests=${REGISTRATION_RATE_LIMIT_REQUESTS:5}
app.security.rate-limit.registration.window-seconds=${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:3600}

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ==============================================================================
# AI Assistant (exam support chatbot)
# ==============================================================================
# The chatbot calls an OpenAI compatible chat completions endpoint. The key is read
# from the environment so no credential is committed; when it is empty the assistant is
# disabled and the API answers with a graceful "not available" response.
app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.openai-base-url=${OPENAI_BASE_URL:https://opencode.ai/inference/openai/v1}
app.ai.openai-model=${OPENAI_MODEL:glm-5.3}
app.ai.openai-max-tokens=${OPENAI_MAX_TOKENS:800}
app.ai.openai-temperature=${OPENAI_TEMPERATURE:0.2}
