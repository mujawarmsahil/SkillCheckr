# ==============================================================================
# Production only. Activate with: SPRING_PROFILES_ACTIVE=prod
#
# The production image sets this profile, so a deployment that forgets TOKEN_SECRET
# now fails to start instead of quietly signing tokens with a secret published in this
# repository. Values still come from the environment; nothing secret is stored here.
# ==============================================================================

# The hosted frontend only. No loopback and no wildcards: with credentials enabled a
# wildcard origin would let any site read authenticated API responses.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://skill-checkr.vercel.app}

# No fallback. `DeploymentConfigurationValidator` requires a real value of at least 32
# characters whenever this profile, or no profile at all, is active.
app.security.token-secret=${TOKEN_SECRET:}

# Actuator health is reachable without a token, so a production deployment must not
# publish component detail to anonymous callers. The dev profile enables `always` for
# local inspection; base and prod profiles strictly keep `never`, reducing the response
# body to the bare `{"status":"UP"}` aggregate with no component names.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
