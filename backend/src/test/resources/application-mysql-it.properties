spring.datasource.url=${SKILLCHECKR_MYSQL_IT_URL}
spring.datasource.username=${SKILLCHECKR_MYSQL_IT_USERNAME}
spring.datasource.password=${SKILLCHECKR_MYSQL_IT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
# Flyway migrates the integration schema before Hibernate starts, so schema
# validation is safe here, as in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
