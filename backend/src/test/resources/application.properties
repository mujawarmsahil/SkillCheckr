spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=false
# This file shadows the main application.properties on the test classpath. The H2
# schema has no Flyway migrations, so Hibernate generates it (`create-drop`, the
# embedded-database default, made explicit). Tests that need the real migrated
# schema use the Testcontainers MySQL fixtures, which enable Flyway and switch
# ddl-auto to validate themselves.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Mirrors the main application.properties. This file shares its name with the main one, so it
# replaces it on the test classpath rather than layering on top, and the setting has to be
# repeated here for the tests to exercise the same JSON number binding as the running app.
spring.jackson.deserialization.accept-float-as-int=false
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
app.security.token-secret=skillcheckr-test-secret-key-value-for-unit-tests
app.security.token-ttl-minutes=60
